<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Paatu Petti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a120d;--ink:#f6ead8;--muted:#b9a88f;--panel:#241913;--line:#3a2a1f;--accent:#f0a24a}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#2a1b12,var(--bg) 60%);color:var(--ink);font-family:'DM Sans',sans-serif;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.hidden{display:none!important}

/* ---------- HOME / CD SHELF ---------- */
#home{padding:40px 16px 60px;text-align:center}
#home h1{font-family:'Fraunces',serif;font-weight:800;font-size:clamp(40px,7vw,76px);margin:0;letter-spacing:-1px}
#home h1 span{color:var(--accent)}
#home p.sub{color:var(--muted);margin:8px 0 40px}
.shelf{max-width:1040px;margin:0 auto}
.row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap;padding:60px 12px 0}
.plank{height:22px;background:linear-gradient(#9a6539,#5e3a1f);border-radius:4px;box-shadow:0 14px 24px rgba(0,0,0,.55),inset 0 2px 0 rgba(255,255,255,.12);margin-bottom:10px}
.cd{width:210px;aspect-ratio:1;border:0;padding:0;background:none;position:relative;transition:transform .35s,opacity .4s}
.cd .disc{position:absolute;inset:7%;border-radius:50%;background:radial-gradient(circle,#ddd 0 7%,#222 7.5% 9%,transparent 9.5%),conic-gradient(from 30deg,#e8e8f0,#b5d3f5,#f5c6e8,#f8f1b8,#c8f5d3,#e8e8f0);box-shadow:0 0 0 1px rgba(0,0,0,.2);transition:transform .5s cubic-bezier(.3,1.4,.5,1);z-index:0}
.cd .case{position:absolute;inset:0;border-radius:6px;background:var(--cover);box-shadow:0 10px 22px rgba(0,0,0,.5),inset 0 0 0 1px rgba(255,255,255,.15);overflow:hidden;z-index:1;display:flex;flex-direction:column;justify-content:flex-end;padding:18px 18px 18px 30px;text-align:left}
.cd .case::before{content:"";position:absolute;left:0;top:0;bottom:0;width:14px;background:rgba(0,0,0,.35);box-shadow:inset -1px 0 0 rgba(255,255,255,.15)}
.cd .case::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.22),transparent 40%)}
.cd .emo{font-size:46px;position:absolute;top:16px;right:18px}
.cd .t{font-family:'Fraunces',serif;font-weight:800;font-size:22px;line-height:1.05}
.cd .tg{font-size:12px;opacity:.8;margin-top:6px}
.cd:hover{transform:translateY(-6px) rotate(-1deg)}
.cd:hover .disc{transform:translateY(-34%)}
.cd:focus-visible{outline:3px solid var(--accent);outline-offset:6px}
.cd.eject .disc{transform:translateY(-140%) rotate(540deg)}
.shelf.picking .cd:not(.eject){opacity:.25}
.keylink{margin-top:36px;background:none;border:1px solid var(--line);border-radius:99px;padding:8px 16px;color:var(--muted)}

/* ---------- SCENE VIEW ---------- */
#view{padding:12px 16px 24px}
.topbar{display:flex;align-items:center;gap:12px;max-width:1500px;margin:0 auto 12px}
.topbar h2{font-family:'Fraunces',serif;margin:0;font-size:26px;flex:1}
.topbar h2 small{display:block;font-family:'DM Sans';font-weight:400;font-size:13px;color:var(--muted)}
.btn{background:#33241a;border:1px solid var(--line);border-radius:10px;padding:8px 14px}
.btn:hover{border-color:var(--accent)}
.layout{display:grid;grid-template-columns:1fr 360px;gap:16px;max-width:1500px;margin:0 auto;align-items:start;transition:grid-template-columns .3s}
.layout.mini{grid-template-columns:1fr 280px}
@media(max-width:960px){.layout{grid-template-columns:1fr}}
.stage{position:relative;border-radius:16px;overflow:hidden;background:#000;box-shadow:0 20px 50px rgba(0,0,0,.6)}
.scene{position:relative;width:100%;aspect-ratio:var(--r,16/9);margin:0 auto}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border-radius:0}
.stage:fullscreen .scene{width:min(100vw,calc(100vh * var(--rn,1.7778)))}
.stage:-webkit-full-screen{display:flex;align-items:center;justify-content:center}
.stage:-webkit-full-screen .scene{width:min(100vw,calc(100vh * var(--rn,1.7778)))}
#art,#fx{position:absolute;inset:0}
#art svg,#art img{width:100%;height:100%;display:block;object-fit:cover}
#fx{pointer-events:none;z-index:2}
#ytwrap{position:absolute;z-index:3;background:#000;transition:all .45s ease}
#ytwrap iframe{width:100%;height:100%;display:block;border:0}
.stage-tools{position:absolute;right:10px;bottom:10px;z-index:4;display:flex;gap:6px;opacity:.85;transition:opacity .3s}
.stage:fullscreen .stage-tools{opacity:0}.stage:fullscreen:hover .stage-tools{opacity:1}
.stage-tools .fsonly{display:none}.stage:fullscreen .stage-tools .fsonly,.stage:-webkit-full-screen .stage-tools .fsonly{display:inline-block}
.stage-tools .btn{background:rgba(20,14,10,.75);backdrop-filter:blur(6px);font-size:13px;padding:6px 10px}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 90px);min-height:420px}
.np small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px;display:flex;justify-content:space-between;align-items:center}
.np small button{background:none;border:1px solid var(--line);border-radius:8px;color:var(--muted);font-size:11px;padding:3px 8px;text-transform:none;letter-spacing:0}
.np small button:hover{color:var(--accent);border-color:var(--accent)}
.layout.mini .panel{min-height:0;gap:10px}
.layout.mini .panel .search,.layout.mini .panel #results,.layout.mini .panel .lh,.layout.mini .panel #queue{display:none!important}
.layout.mini .np .tt{font-size:14px}
.np .tt{font-weight:700;margin-top:4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ctrls{display:flex;gap:8px}
.ctrls button{flex:1;background:#33241a;border:1px solid var(--line);border-radius:10px;padding:10px 0;font-size:16px}
.ctrls button:hover{border-color:var(--accent)}
.ctrls .play{background:var(--accent);color:#1a120d;border-color:var(--accent)}
form.search{display:flex;gap:6px}
form.search input{flex:1;min-width:0;background:#1a120d;border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit}
form.search input:focus{outline:none;border-color:var(--accent)}
.list{overflow:auto;flex:1;display:flex;flex-direction:column;gap:4px;margin:0 -6px;padding:0 6px}
.lh{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.lh button{background:none;border:0;color:var(--muted);font-size:12px;text-transform:none;letter-spacing:0}
.lh button:hover{color:var(--accent)}
.song{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;background:none;border:0;text-align:left;width:100%}
.song:hover{background:#2f2119}
.song.on{background:color-mix(in srgb,var(--accent) 22%,transparent)}
.song img{width:56px;height:42px;object-fit:cover;border-radius:6px;flex:none}
.song .m{min-width:0;flex:1}
.song .a{font-size:13.5px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.song .c{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.song .add{flex:none;background:#33241a;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:12px}
.msg{color:var(--muted);font-size:14px;padding:16px 4px;text-align:center}
#results{max-height:220px;flex:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#33241a;border:1px solid var(--accent);padding:10px 16px;border-radius:10px;z-index:50;font-size:14px}

dialog{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:16px;max-width:460px;width:calc(100% - 32px);padding:22px}
dialog::backdrop{background:rgba(0,0,0,.6)}
dialog h3{font-family:'Fraunces',serif;margin:0 0 8px}
dialog p{color:var(--muted);font-size:14px;line-height:1.5}
dialog a{color:var(--accent)}
dialog input{width:100%;background:#1a120d;border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);font:inherit;margin:8px 0 14px}

/* ---------- SCENE ANIMATIONS ---------- */
.drop{position:absolute;top:-20%;width:1.5px;height:16%;background:linear-gradient(transparent,rgba(225,238,255,.75));animation:fall linear infinite}
@keyframes fall{to{transform:translateY(750%)}}
.rainbox{position:absolute;overflow:hidden}
.twinkle{animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.blink{animation:bl 1.6s ease-in-out infinite}
@keyframes bl{50%{opacity:.2}}
.bob{animation:bob .55s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes bob{to{transform:translateY(-12px)}}
.steam{animation:steam 3s ease-in infinite;opacity:0}
@keyframes steam{0%{opacity:0;transform:translateY(10px)}30%{opacity:.7}100%{opacity:0;transform:translateY(-40px)}}
.flicker{animation:fl .18s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom center}
@keyframes fl{to{transform:scaleY(.86) scaleX(1.06)}}
.spin{animation:spin 9s linear infinite;transform-box:view-box}
@keyframes spin{to{transform:rotate(360deg)}}
.sway{animation:sway 4s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:top center}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.road{stroke-dasharray:30 40;animation:road .6s linear infinite}
@keyframes road{to{stroke-dashoffset:70}}
.fan{animation:spin .4s linear infinite;transform-box:fill-box;transform-origin:center}
.screenglow{animation:sg 2.5s ease-in-out infinite alternate}
@keyframes sg{to{opacity:.55}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home">
  <h1>Paatu <span>Petti</span></h1>
  <p class="sub">Pick a CD. Pick a mood. Press play.</p>
  <div class="shelf" id="shelf"></div>
  <button class="keylink" onclick="openKey()">⚙ YouTube API key</button>
</section>

<!-- SCENE -->
<section id="view" class="hidden">
  <div class="topbar">
    <button class="btn" onclick="goHome()">⏏ Shelf</button>
    <h2 id="gTitle">—<small id="gTag"></small></h2>
  </div>
  <div class="layout">
    <div class="stage" id="stage">
      <div class="scene" id="scene">
        <div id="art"></div>
        <div id="fx"></div>
        <div id="ytwrap"><div id="yt"></div></div>
      </div>
      <div class="stage-tools">
        <button class="btn fsonly" onclick="prev()" title="Previous">⏮</button>
        <button class="btn fsonly" onclick="togglePlay()" title="Play/Pause">⏯</button>
        <button class="btn fsonly" onclick="next()" title="Next">⏭</button>
        <button class="btn" onclick="toggleFS()" id="fsBtn">⛶ Fullscreen</button>
      </div>
    </div>
    <aside class="panel">
      <div class="np"><small><span>Now playing</span><button onclick="toggleMini()" id="miniBtn">▾ Minimize</button></small><div class="tt" id="npTitle">—</div></div>
      <div class="ctrls">
        <button onclick="prev()" title="Previous">⏮</button>
        <button onclick="togglePlay()" class="play" id="playBtn" title="Play/Pause">⏯</button>
        <button onclick="next()" title="Next">⏭</button>
        <button onclick="shuffleQ()" title="Shuffle">🔀</button>
      </div>
      <form class="search" onsubmit="doSearch(event)">
        <input id="q" placeholder="Search any song to add…" autocomplete="off">
        <button class="btn" type="submit">🔍</button>
      </form>
      <div class="list hidden" id="results"></div>
      <div class="lh"><span>Up next</span><button onclick="loadGenre(cur,true)">↻ New mix</button></div>
      <div class="list" id="queue"><div class="msg">Spinning up the CD…</div></div>
    </aside>
  </div>
</section>

<dialog id="keyDlg">
  <h3>YouTube API key</h3>
  <p>Paste your free YouTube Data API v3 key. It's stored only in this browser. Get one at <a href="https://console.cloud.google.com/apis/library/youtube.googleapis.com" target="_blank" rel="noopener">Google Cloud Console</a>; steps are in the README.</p>
  <input id="keyIn" placeholder="AIza…">
  <div style="display:flex;gap:8px;justify-content:flex-end">
    <button class="btn" onclick="keyDlg.close()">Cancel</button>
    <button class="btn" style="background:var(--accent);color:#1a120d" onclick="saveKey()">Save</button>
  </div>
</dialog>

const SVG_KAAPI = `<svg viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">

function rainIn(fx, [l,t,w,h], n, op=1){
  const b=document.createElement('div'); b.className='rainbox';
  Object.assign(b.style,{left:l+'%',top:t+'%',width:w+'%',height:h+'%',opacity:op});
  for(let i=0;i<n;i++){const d=document.createElement('div');d.className='drop';
    d.style.left=Math.random()*100+'%';d.style.animationDuration=(.5+Math.random()*.5)+'s';d.style.animationDelay=(-Math.random()*2)+'s';b.appendChild(d)}
  fx.appendChild(b);
}
const NS='http://www.w3.org/2000/svg';
function el(tag,attrs,parent){const e=document.createElementNS(NS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);parent&&parent.appendChild(e);return e}
function stars(svg,n,maxY){const g=svg.querySelector('#stars');if(!g)return;for(let i=0;i<n;i++){const s=el('circle',{cx:Math.random()*1600,cy:Math.random()*maxY,r:Math.random()*1.8+.4,fill:'#fff'},g);if(Math.random()<.4){s.classList.add('twinkle');s.style.animationDelay=(-Math.random()*3)+'s'}}}

/* ---------------- YOUTUBE ---------------- */
async function ytSearch(q,max){
  const key=getKey(); if(!key) throw new Error('NOKEY');
  const u=new URL('https://www.googleapis.com/youtube/v3/search');
  Object.entries({part:'snippet',type:'video',videoEmbeddable:'true',videoSyndicated:'true',videoCategoryId:'10',regionCode:'IN',maxResults:max,q,key}).forEach(([k,v])=>u.searchParams.set(k,v));
  const j=await (await fetch(u)).json();
  if(j.error){const r=j.error.errors?.[0]?.reason||'';throw new Error(r.includes('quota')?'Daily YouTube quota used up. It resets around 12:30 PM IST.':j.error.message)}
  return j.items.map(it=>({id:it.id.videoId,title:dec(it.snippet.title),ch:dec(it.snippet.channelTitle),thumb:it.snippet.thumbnails?.medium?.url||it.snippet.thumbnails?.default?.url}));
}
const shuf=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

async function loadGenre(g,force){
  const qEl=$('#queue');qEl.innerHTML='<div class="msg">Spinning up the CD…</div>';
  const ck='pp_cache_'+g.id, c=store.get(ck);
  let items;
  if(!force&&c&&Date.now()-c.t<864e5&&c.q===g.query) items=c.items.slice();
  else try{items=await ytSearch(g.query,40);store.set(ck,{t:Date.now(),q:g.query,items})}
  catch(e){ if(e.message==='NOKEY'){qEl.innerHTML='<div class="msg">Add your YouTube API key to start playing.</div>';openKey();}else qEl.innerHTML=`<div class="msg">⚠ ${esc(e.message)}</div>`;return }
  if(cur!==g)return;
  queue=shuf(items);idx=0;renderQueue();playIdx(0);
}
function renderQueue(){
  const q=$('#queue');if(!queue.length){q.innerHTML='<div class="msg">Queue is empty.</div>';return}
  q.innerHTML=queue.map((s,i)=>`<button class="song${i===idx?' on':''}" onclick="playIdx(${i})"><img src="${s.thumb}" alt="" loading="lazy"><div class="m"><div class="a">${esc(s.title)}</div><div class="c">${esc(s.ch)}</div></div></button>`).join('');
  q.querySelector('.on')?.scrollIntoView({block:'nearest'});
}
function playIdx(i){
  if(!queue[i])return;idx=i;const s=queue[i];$('#npTitle').textContent=s.title;renderQueue();
  if(ready)player.loadVideoById(s.id);else pending=s.id;
}
const next=()=>queue.length&&playIdx((idx+1)%queue.length);
const prev=()=>queue.length&&playIdx((idx-1+queue.length)%queue.length);
function togglePlay(){if(!ready)return;player.getPlayerState()===1?player.pauseVideo():player.playVideo()}
function shuffleQ(){if(!queue.length)return;const c=queue[idx];queue=[c,...shuf(queue.filter((_,i)=>i!==idx))];idx=0;renderQueue();toast('Shuffled 🔀')}

async function doSearch(e){
  e.preventDefault();const q=$('#q').value.trim();if(!q)return;const r=$('#results');
  r.classList.remove('hidden');r.innerHTML='<div class="msg">Searching…</div>';
  try{const items=await ytSearch(q,8);r._items=items;
    r.innerHTML=`<div class="lh"><span>Results</span><button onclick="$('#results').classList.add('hidden')">✕ close</button></div>`+items.map((s,i)=>`<div class="song"><img src="${s.thumb}" alt=""><div class="m"><div class="a">${esc(s.title)}</div><div class="c">${esc(s.ch)}</div></div><button class="add" onclick="addRes(${i},1)">▶</button><button class="add" onclick="addRes(${i},0)">＋</button></div>`).join('')}
  catch(err){r.innerHTML=`<div class="msg">⚠ ${err.message==='NOKEY'?'Add your API key first.':esc(err.message)}</div>`;if(err.message==='NOKEY')openKey()}
}
function addRes(i,playNow){const s=$('#results')._items[i];queue.splice(idx+1,0,s);if(playNow)playIdx(idx+1);else{renderQueue();toast('Added to up next')}}

function openKey(){$('#keyIn').value=store.get('pp_key')||'';keyDlg.showModal()}
function saveKey(){const k=$('#keyIn').value.trim();store.set('pp_key',k);keyDlg.close();toast(k?'Key saved ✓':'Key cleared');if(k&&cur&&!$('#view').classList.contains('hidden'))loadGenre(cur)}

window.onYouTubeIframeAPIReady=()=>{
  player=new YT.Player('yt',{width:'100%',height:'100%',playerVars:{playsinline:1,rel:0,modestbranding:1},
    events:{onReady:()=>{ready=true;if(pending){player.loadVideoById(pending);pending=null}},
      onStateChange:e=>{if(e.data===YT.PlayerState.ENDED)next()},
      onError:()=>{toast("This one can't play here, skipping ⏭");setTimeout(next,900)}}});
};
document.addEventListener('keydown',e=>{if($('#view').classList.contains('hidden')||e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();togglePlay()}if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft')prev();if(e.key==='f')toggleFS()});
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
